name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          node tests/e2e.mjs
      - run: node tests/visual.mjs
      - run: node tests/budgets.mjs
      - name: Test published preview
        if: github.event_name == 'pull_request' && matrix.browser == 'chromium'
        env:
          TEST_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--rlgastosapp.netlify.app
        run: |
          node tests/wait-preview.mjs
          node tests/e2e.mjs
          node tests/budgets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-preview-${{ matrix.browser }}
          path: artifacts/
          retention-days: 7
